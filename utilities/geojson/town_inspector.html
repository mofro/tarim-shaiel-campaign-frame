<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Town Inspector</title>
<style>
:root {
  --bg: #1a1208; --panel: #241a0e; --line: #4a3a22; --ink: #f1e6cf; --dim: #c9b890;
  --gold: #e0b44c; --sel: #ff7a3d; --fac: #6fc3d9;
  --t-1: 0.8125rem; --t0: 1rem; --t1: 1.25rem;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--t0)/1.45 system-ui, sans-serif;
  display: grid; grid-template-columns: 1fr 26rem; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
header { grid-column: 1 / 3; padding: .5rem 1rem; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: baseline; }
h1 { margin: 0; font-size: var(--t1); color: var(--gold); }
.banner { color: var(--dim); font-size: var(--t-1); }
#map { width: 100%; height: 100%; display: block; cursor: crosshair; }
#wrap { position: relative; overflow: hidden; min-height: 0; }
#map { position: absolute; inset: 0; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 1rem; }
aside h2 { margin: 0 0 .25rem; font-size: var(--t1); }
.kv { display: grid; grid-template-columns: 7rem 1fr; gap: .15rem .75rem; margin: .5rem 0 1rem; }
.kv dt { color: var(--dim); font-size: var(--t-1); text-transform: uppercase; letter-spacing: .05em; }
.kv dd { margin: 0; }
.chip { color: var(--fac); }
ul { margin: .25rem 0 1rem; padding-left: 1.1rem; }
li button { all: unset; cursor: pointer; color: var(--gold); text-decoration: underline; }
li button:focus-visible { outline: 2px solid var(--gold); }
.empty { color: var(--dim); font-size: var(--t-1); }
.sub { color: var(--dim); margin: 0 0 .75rem; }
aside h3 { font-size: var(--t0); margin: 1rem 0 .25rem; color: var(--gold); }
details { margin-top: 1rem; color: var(--dim); font-size: var(--t-1); }
summary { cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .25rem .75rem; }
.stats b { color: var(--ink); }
.back { all: unset; cursor: pointer; color: var(--dim); font-size: var(--t-1); margin-bottom: .5rem; display: inline-block; }
.kv button, .stats ~ p button { all: unset; cursor: pointer; color: var(--gold); text-decoration: underline; }
label { font-size: var(--t-1); color: var(--dim); }
input[type=search] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: .25rem .5rem; font: inherit; }
#clock { position: absolute; left: .5rem; right: .5rem; bottom: .5rem; background: var(--panel); border: 1px solid var(--line); padding: .4rem .6rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
#clock #hour { flex: 1 1 10rem; min-width: 8rem; }
#roster-btn, aside select, header select { max-width: 14rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: .15rem .4rem; cursor: pointer; }
aside select, aside input[type=search] { width: 100%; margin: 0 0 .5rem; }
aside label { display: block; }
#clock select, #clock button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: .15rem .4rem; }
#clock output { min-width: 3rem; color: var(--gold); }
@media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) 40vh; } header { grid-column: 1; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1 id="title">Town Inspector</h1>
  <span class="banner">GM only. Served from localhost; never part of a player build.</span>
  <label>Find <input id="find" type="search" placeholder="building or person" aria-label="Find a building or person"></label>
  <label>Type <select id="btype" aria-label="Show every building of one type"><option value="">any building</option></select></label>
  <button id="roster-btn" type="button">Roster</button>
</header>
<div id="wrap"><canvas id="map" aria-label="Town map; click a building"></canvas>
  <div id="clock"><label>Time <input id="time-on" type="checkbox" aria-label="Show who is where at a time of day"></label>
    <select id="day" aria-label="Day of week"><option value="1">Mon</option><option value="2">Tue</option><option value="3">Wed</option><option value="4">Thu</option><option value="5">Fri</option><option value="6">Sat</option><option value="7">Sun</option></select>
    <input id="hour" type="range" min="0" max="23" value="12" aria-label="Hour of day"><output id="hourout">12:00</output>
    <button id="play" type="button">Play</button>
    <span class="empty">Derived guess from building hours, jobs and homes, not FTG's own schedule. Brighter is busier.</span></div></div>
<aside id="side"><p class="empty">Click a building, search by name, or open the Roster to filter everyone.</p></aside>
<script>
const TOWN = location.pathname.split("/").filter(Boolean).pop();
let D, view = {x: 0, y: 0, k: 1}, sel = null, polys = [], hl = new Set();
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
const COLOR = {BACKGROUND: "#2b2113", WATER: "#2c4a63", BUILDING: "#7d6a44"};
const ROAD = {MAIN_ROAD: "#b59a62"};

fetch("/api/town/" + encodeURIComponent(TOWN)).then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { D = d; document.getElementById("title").textContent = d.town + " inspector"; build(); fillTypes(); fit(); draw(); })
  .catch(e => { document.getElementById("side").textContent = "Could not load " + TOWN + " (" + e + "). Run the draft first."; });

function build() {
  polys = D.geojson.features.map(f => {
    const g = f.geometry, ring = g.type === "Polygon" ? g.coordinates[0] : g.coordinates;
    return {f, ring, id: f.properties.id, type: f.properties.type};
  });
}
function fit() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of polys) if (p.type === "BUILDING") for (const [x, y] of p.ring) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const w = cv.clientWidth, h = cv.clientHeight;
  view.k = Math.min(w / (x1 - x0), h / (y1 - y0)) * 0.95;
  view.x = w / 2 - (x0 + x1) / 2 * view.k; view.y = h / 2 + (y0 + y1) / 2 * view.k;
}
const sx = x => x * view.k + view.x, sy = y => view.y - y * view.k;
function resize() { const r = devicePixelRatio || 1; cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
function path(ring, close) { ctx.beginPath(); ring.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))); if (close) ctx.closePath(); }
function draw() {
  if (!D) return; resize(); ctx.clearRect(0, 0, cv.width, cv.height);
  for (const p of polys) if (p.type === "BACKGROUND" || p.type === "WATER") { path(p.ring, true); ctx.fillStyle = COLOR[p.type]; ctx.fill(); }
  ctx.lineWidth = 1.5;
  for (const p of polys) if (p.type === "EDGE") { path(p.ring, false); ctx.strokeStyle = ROAD[p.f.properties.edgeType] || "#6b5a3a"; ctx.stroke(); }
  for (const p of polys) if (p.type === "BUILDING") {
    const b = D.buildings[p.id]; path(p.ring, true);
    ctx.fillStyle = snap ? heat(p.id) : b && b.seats.length ? "#3f8fa5" : COLOR.BUILDING; ctx.fill();
    if (hl.has(p.id)) { ctx.lineWidth = 2.5; ctx.strokeStyle = "#e0b44c"; ctx.stroke(); ctx.lineWidth = 1.5; }
    if (p.id === sel) { ctx.lineWidth = 3; ctx.strokeStyle = "#ff7a3d"; ctx.stroke(); ctx.lineWidth = 1.5; }
  }
}
// Time of day: who is where, derived server-side (town_schedule.py). Null when the clock is off.
let snap = null, maxCount = 1, active = {}, tseq = 0, playTimer = null;
const dayEl = document.getElementById("day"), hourEl = document.getElementById("hour"), onEl = document.getElementById("time-on");
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function heat(id) {
  // colour by people out and about there; residents asleep or at home do not light a closed building
  const n = active[id] || 0, b = D.buildings[id];
  if (!n) return b && b.hours && !isOpenNow(b) ? "#3a2f1d" : "#5b4d31";
  const t = Math.sqrt(n / maxCount);
  return `rgb(${Math.round(125 + 130 * t)},${Math.round(106 + 60 * t)},${Math.round(68 - 20 * t)})`;
}
function isOpenNow(b) {
  const h = b.hours, d = snap.day, hr = snap.hour;
  if (h.closedDays && h.closedDays.includes(d)) return false;
  return h.openHour < h.closeHour ? hr >= h.openHour && hr < h.closeHour : hr >= h.openHour || hr < h.closeHour;
}
function refreshClock() {
  document.getElementById("hourout").textContent = hour(hourEl.value);
  if (!onEl.checked) { snap = null; draw(); if (cur) show(cur.kind, cur.id, false); return; }
  const seq = ++tseq;
  fetch(`/api/town/${encodeURIComponent(TOWN)}/at?day=${dayEl.value}&hour=${hourEl.value}`).then(r => r.json()).then(s => {
    if (seq !== tseq) return;
    snap = s; active = {};
    for (const v of Object.values(s.where)) if (v[0] != null && v[1] !== "asleep" && v[1] !== "at home") active[v[0]] = (active[v[0]] || 0) + 1;
    maxCount = Math.max(1, ...Object.values(active));
    draw(); if (cur) { const keep = side.scrollTop; show(cur.kind, cur.id, false); side.scrollTop = keep; }
  });
}
onEl.addEventListener("change", () => { if (!onEl.checked) stopPlay(); refreshClock(); });
dayEl.addEventListener("change", () => { onEl.checked = true; refreshClock(); });
hourEl.addEventListener("input", () => { onEl.checked = true; refreshClock(); });
function stopPlay() { clearInterval(playTimer); playTimer = null; document.getElementById("play").textContent = "Play"; }
document.getElementById("play").addEventListener("click", () => {
  if (playTimer) return stopPlay();
  onEl.checked = true; document.getElementById("play").textContent = "Pause";
  playTimer = setInterval(() => {
    let h = +hourEl.value + 1;
    if (h > 23) { h = 0; dayEl.value = (+dayEl.value % 7) + 1; }
    hourEl.value = h; refreshClock();
  }, 700);
});
function nowAt(id) { return snap && snap.where[id] ? snap.where[id] : null; }
function inside(ring, x, y) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - view.x) / view.k, y = (view.y - (e.clientY - r.top)) / view.k;
  const hit = polys.find(p => p.type === "BUILDING" && inside(p.ring, x, y));
  if (hit) pick(hit.id);
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, f = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f; draw();
}, {passive: false});
let drag = null;
cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; draw(); } });
cv.addEventListener("pointerup", () => { setTimeout(() => drag = null); });
cv.addEventListener("click", e => { if (drag && drag.moved) e.stopImmediatePropagation(); }, true);
addEventListener("resize", () => { fit(); draw(); });

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const side = document.getElementById("side");
const hist = []; let cur = null;
const PERSONALITY = {
  extroversion: ["very reserved, keeps to themself", "somewhat reserved", "fairly sociable", "very outgoing"],
  conscientiousness: ["careless and disorganised", "somewhat careless", "fairly conscientious", "very conscientious, attentive to detail"],
  openness: ["set in their ways", "somewhat conventional", "fairly open-minded", "very open-minded"],
  agreeableness: ["distrusting and combative", "somewhat distrusting", "fairly agreeable", "very agreeable and trusting"],
  neuroticism: ["very calm", "fairly calm", "somewhat anxious", "very anxious, quick to anger"],
};
const STATS = ["strength", "dexterity", "constitution", "intelligence", "wisdom", "charisma"];
const hour = h => String(h).padStart(2, "0") + ":00";
const link = (kind, id, label) => `<button data-${kind}="${id}">${esc(label)}</button>`;
function personRow(id) {
  const p = D.people[id];
  return `<li>${link("person", id, p.name)} <span class="empty">${esc(p.job || "no job")}, ${esc(p.race)}, ${esc(p.age)}</span></li>`;
}
function list(ids) { return ids.length ? `<ul>${ids.map(personRow).join("")}</ul>` : `<p class="empty">none</p>`; }
function names(ids) { return ids.length ? ids.map(i => link("person", i, D.people[i].name)).join(", ") : `<span class="empty">none</span>`; }
function place(id) { return id == null ? `<span class="empty">none</span>` : link("b", id, D.buildings[id]?.name ?? "unknown"); }
function twirl(rows) {
  return `<details><summary>Source details</summary><dl class="kv">${rows.filter(Boolean).join("")}</dl></details>`;
}
const row = (k, v) => v == null || v === "" ? "" : `<dt>${k}</dt><dd>${v}</dd>`;
function show(kind, id, push = true) {
  if (push && cur) hist.push(cur); cur = {kind, id};
  const back = hist.length ? `<button class="back" data-back="1">&larr; Back</button>` : "";
  side.innerHTML = back + (kind === "b" ? buildingHtml(id) : kind === "r" ? rosterHtml() : kind === "t" ? typeHtml(id) : personHtml(id));
  if (kind === "r") updateRoster(); else if (kind === "t") { sel = null; hl = new Set(typeIds(id)); draw(); } else if (hl.size) { hl = new Set(); draw(); }
  side.scrollTop = 0;
}
// Roster: filter everyone by race, faith, job, faction or where they work. Matches' workplaces are outlined on the map.
const rf = {q: "", race: "", religion: "", job: "", faction: "", kind: ""};
const ROSTER_MAX = 150;
function facets() {
  const out = {race: new Map(), religion: new Map(), job: new Map(), faction: new Map(), kind: new Map()};
  const add = (m, k) => { if (k) m.set(k, (m.get(k) || 0) + 1); };
  for (const p of Object.values(D.people)) {
    add(out.race, p.race); add(out.religion, p.religion); add(out.job, p.job);
    p.factions.forEach(f => add(out.faction, f));
    add(out.kind, p.work != null ? D.buildings[p.work]?.specificBuildingType : null);
  }
  return out;
}
function rosterMatches() {
  const q = rf.q.toLowerCase();
  return Object.values(D.people).filter(p =>
    (!q || p.name.toLowerCase().includes(q)) && (!rf.race || p.race === rf.race) && (!rf.religion || p.religion === rf.religion)
    && (!rf.job || p.job === rf.job) && (!rf.faction || p.factions.includes(rf.faction))
    && (!rf.kind || (p.work != null && D.buildings[p.work]?.specificBuildingType === rf.kind)))
    .sort((a, b) => a.name.localeCompare(b.name));
}
function rosterHtml() {
  const f = facets(), sel1 = (key, label) => `<label>${label}<select data-rf="${key}"><option value="">any</option>${
    [...f[key]].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([v, n]) => `<option value="${esc(v)}"${rf[key] === v ? " selected" : ""}>${esc(v)} (${n})</option>`).join("")}</select></label>`;
  return `<h2>Roster</h2><p class="sub">Filter the town's people. Matching workplaces are outlined on the map.</p>
    <label>Name<input type="search" data-rf="q" value="${esc(rf.q)}" placeholder="part of a name"></label>
    ${sel1("race", "Ancestry")}${sel1("religion", "Faith")}${sel1("job", "Occupation")}${sel1("faction", "Faction")}${sel1("kind", "Works in a")}
    <button class="back" data-rclear="1">Clear filters</button><div id="rres"></div>`;
}
function updateRoster() {
  const box = document.getElementById("rres"); if (!box) return;
  const m = rosterMatches(), active = Object.values(rf).some(Boolean);
  hl = new Set(active ? m.filter(p => p.work != null).map(p => p.work) : []); draw();
  box.innerHTML = `<h3>${m.length} ${m.length === 1 ? "person" : "people"}</h3><ul>${m.slice(0, ROSTER_MAX).map(p => personRow(p.id)).join("")}</ul>${
    m.length > ROSTER_MAX ? `<p class="empty">and ${m.length - ROSTER_MAX} more; narrow the filters.</p>` : ""}`;
}
// Building type picker: outline every building of one specificBuildingType and list them.
const btypeEl = document.getElementById("btype");
const typeIds = t => Object.values(D.buildings).filter(b => b.specificBuildingType === t).map(b => b.id);
function fillTypes() {
  const n = new Map();
  for (const b of Object.values(D.buildings)) if (b.specificBuildingType) n.set(b.specificBuildingType, (n.get(b.specificBuildingType) || 0) + 1);
  btypeEl.innerHTML = `<option value="">any building (${n.size} types)</option>` + [...n].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([t, c]) => `<option value="${esc(t)}">${esc(t)} (${c})</option>`).join("");
}
function typeHtml(t) {
  const ids = typeIds(t).sort((a, b) => D.buildings[a].name.localeCompare(D.buildings[b].name));
  const li = id => { const b = D.buildings[id]; return `<li>${link("b", id, b.name)} <span class="empty">${b.works.length} work, ${b.lives.length} live${b.seats.length ? ", seat" : ""}</span></li>`; };
  return `<h2>${esc(t)}</h2><p class="sub">${ids.length} ${ids.length === 1 ? "building" : "buildings"}, outlined on the map.</p>
    <ul>${ids.slice(0, ROSTER_MAX).map(li).join("")}</ul>${ids.length > ROSTER_MAX ? `<p class="empty">and ${ids.length - ROSTER_MAX} more.</p>` : ""}`;
}
btypeEl.addEventListener("change", () => {
  if (!D) return;
  if (btypeEl.value) show("t", btypeEl.value);
  else { hl = new Set(); draw(); side.innerHTML = `<p class="empty">Click a building, search by name, or open the Roster to filter everyone.</p>`; cur = null; }
});
function openRoster() { sel = null; show("r", 0); }
document.getElementById("roster-btn").addEventListener("click", () => D && openRoster());
side.addEventListener("input", e => { const k = e.target.dataset.rf; if (k != null) { rf[k] = e.target.value; updateRoster(); } });
side.addEventListener("change", e => { const k = e.target.dataset.rf; if (k != null) { rf[k] = e.target.value; updateRoster(); } });
function pick(id) { sel = id; draw(); if (D.buildings[id]) show("b", id); }
function person(id) { const p = D.people[id]; show("p", id); if (p.work != null) { sel = p.work; draw(); } }
function hereNow(id) {
  if (!snap) return "";
  const ids = Object.keys(snap.where).filter(p => snap.where[p][0] === id).map(Number);
  const stamp = `${DAYS[snap.day - 1]} ${hour(snap.hour)}`;
  const shown = ids.slice(0, 40).map(p => `<li>${link("person", p, D.people[p].name)} <span class="empty">${esc(snap.where[p][1])}</span></li>`).join("");
  const open = D.buildings[id].hours ? (isOpenNow(D.buildings[id]) ? ", open" : ", closed") : "";
  return `<h3>Here at ${stamp} (${ids.length}${open}; ${active[id] || 0} active, ${ids.length - (active[id] || 0)} asleep or at home)</h3>${ids.length ? `<ul>${shown}</ul>` : `<p class="empty">nobody</p>`}${ids.length > 40 ? `<p class="empty">and ${ids.length - 40} more</p>` : ""}`;
}
function lodgingNow(id) {
  const l = snap && snap.lodging && snap.lodging[id]; if (!l) return "";
  return `<dl class="kv">${row("Beds, " + DAYS[snap.day - 1] + " night", `${esc(l.rating)} (${l.pct}% taken)`)}</dl>`;
}
function roomsHtml(b) {
  const r = b.suggestedRooms; if (!r) return "";
  return `<h3>Suggested rooms (${esc(r.kind)})</h3><ul>${r.rooms.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p class="empty">A starting list for the GM by building type, not from FTG.</p>`;
}
function buildingHtml(id) {
  const b = D.buildings[id], h = b.hours;
  return `<h2>${esc(b.name)}</h2>
    <p class="sub">${esc(b.description || b.specificBuildingType)}</p>
    <dl class="kv">${row("Kind", esc(b.specificBuildingType))}
    ${h ? row("Open", `${hour(h.openHour)} to ${hour(h.closeHour)}${h.closedDays?.length ? ", closed " + h.closedDays.join(", ") : ""}`) : ""}
    ${b.seats.length ? row("Seat of", b.seats.map(s => `<span class="chip">${esc(s)}</span>`).join(", ")) : ""}
    ${b.notes ? row("Notes", esc(b.notes)) : ""}</dl>
    ${lodgingNow(id)}
    ${hereNow(id)}
    <h3>Works here (${b.works.length})</h3>${list(b.works)}
    <h3>Lives here (${b.lives.length})</h3>${list(b.lives)}
    ${roomsHtml(b)}
    <p class="empty">Interior rooms are not part of the FTG export, so who works where inside a building is not available here.</p>
    ${twirl([row("Building id", id), b.ftg ? row("FTG shows", `${esc(b.ftg.name)} (${esc(b.ftg.type)})`) : ""])}`;
}
function personality(core) {
  return core ? Object.keys(PERSONALITY).filter(k => core[k] != null).map(k => PERSONALITY[k][Math.min(3, Math.max(0, core[k]))]).join("; ") : "";
}
function personHtml(id) {
  const p = D.people[id], job = (p.job || "no occupation").toLowerCase();
  const stats = p.stats ? `<div class="stats">${STATS.map(k => `<span><b>${p.stats[k]}</b> ${k.slice(0, 3)}</span>`).join("")}</div>` : "";
  const fac = p.factions.length ? p.factions.map(f => `<span class="chip">${esc(f)}</span>`).join(", ") : "";
  const kin = [["Parents", p.parents], ["Siblings", p.siblings], ["Children", p.children]].filter(([, v]) => v.length)
    .map(([k, v]) => row(k, names(v))).join("");
  return `<h2>${esc(p.name)}</h2>
    <p class="sub">${esc(p.age)} year old ${esc(p.gender)} ${esc(p.race)} ${esc(job)}. Worships ${esc(p.religion || "nothing recorded")}.</p>
    <dl class="kv">${nowAt(id) ? row("At " + DAYS[snap.day - 1] + " " + hour(snap.hour), `${nowAt(id)[0] == null ? "out in the streets" : place(nowAt(id)[0])} (${esc(nowAt(id)[1])})`) : ""}
    ${row("Works at", place(p.work))}${row("Lives at", place(p.home))}${p.study != null ? row("Studies at", place(p.study)) : ""}
    ${p.trait ? row("Pastime", esc(p.trait)) : ""}${fac ? row("Factions", fac) : ""}</dl>
    <h3>Personality</h3><p>${esc(personality(p.core))}</p>
    <p class="empty">Derived from FTG's core values (0 to 3). FTG's own wording is not in the export.</p>
    <h3>Abilities</h3>${stats}${p.height ? `<p class="empty">Height ${p.height} cm</p>` : ""}
    ${kin ? `<h3>Family</h3><dl class="kv">${kin}</dl>` : ""}
    ${p.notes ? `<h3>Notes</h3><p>${esc(p.notes)}</p>` : ""}
    ${twirl([row("Person id", id), p.core ? row("Core values", esc(JSON.stringify(p.core))) : "",
      p.ftg ? row("FTG shows", `${esc(p.ftg.name)}, ${esc(p.ftg.race)}, ${esc(p.ftg.religion)}`) : ""])}`;
}
side.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.back) { const prev = hist.pop(); if (prev) { cur = null; show(prev.kind, prev.id, false); cur = prev; if (prev.kind === "b") { sel = prev.id; draw(); } } }
  else if (t.dataset.rclear) { Object.keys(rf).forEach(k => rf[k] = ""); const keep = cur; cur = null; show("r", 0, false); cur = keep; }
  else if (t.dataset.person) person(+t.dataset.person);
  else if (t.dataset.b) { sel = +t.dataset.b; draw(); show("b", sel); }
});
document.getElementById("find").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(); if (!q || !D) return;
  if (/^\d+$/.test(q) && D.buildings[q]) return pick(+q);
  const b = Object.values(D.buildings).find(x => x.name.toLowerCase().includes(q));
  const p = Object.values(D.people).find(x => x.name.toLowerCase().includes(q));
  if (b && (!p || b.name.toLowerCase().startsWith(q))) pick(b.id); else if (p) person(p.id);
});
</script>
</body>
</html>
