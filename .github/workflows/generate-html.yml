name: Generate HTML Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'CREATION_SESSIONS.md'
      - '.beads/issues.jsonl'
      - 'DASHBOARD.md'
      - 'templates/tarim-shaiel-campaign-frame-v2.md'
      - 'world/**/*.md'
      - 'narrative/**/*.md'
      - 'world/classes/class_primer.md'
      - 'utilities/**/*.py'
      - 'utilities/**/*.css'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        run: python utilities/dashboard/generate_dashboard.py --out docs/dashboard.html

      - name: Generate campaign frame
        run: python utilities/campaign_frame/generate_campaign_frame.py --out docs/campaign-frame.html

      - name: Generate ancestry guide
        run: python utilities/ancestries/generate_ancestry_html.py

      - name: Generate class primer
        run: python utilities/class_primer/generate_class_primer.py

      - name: Generate world HTML + index
        run: python utilities/world/generate_all_world_html.py --public

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "No changes to commit." || (
            git commit -m "chore: regenerate HTML artifacts [skip ci]"
            git push
          )
